<!-- =========================================
     OneSignal + Firestore Subscription
========================================= -->

<script type="module">

import { db } from "./firebase.js";

import {
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


window.OneSignalDeferred =
  window.OneSignalDeferred || [];


OneSignalDeferred.push(async function(OneSignal) {

  try {

    await OneSignal.init({

      appId:
        "ca312fa3-511f-4b36-ab0e-8d774ab70cfc",

      autoResubscribe: true,

      serviceWorkerPath:
        "OneSignalSDKWorker.js",

      notifyButton: {
        enable: true
      }

    });


    console.log(
      "OneSignal initialized successfully."
    );


    // =========================================
    // Save OneSignal Subscription ID
    // =========================================

    async function saveSubscription() {

      try {

        const subscription =
          OneSignal.User.PushSubscription;

        const subscriptionId =
          subscription.id;


        console.log(
          "OneSignal Subscription ID:",
          subscriptionId
        );


        // Not subscribed yet
        if (!subscriptionId) {

          console.log(
            "No OneSignal Subscription ID yet."
          );

          return;

        }


        // =====================================
        // Firestore
        // subscriptions/{OneSignalSubscriptionID}
        // =====================================

        await setDoc(

          doc(
            db,
            "subscriptions",
            subscriptionId
          ),

          {

            subscriptionId:
              subscriptionId,

            updatedAt:
              serverTimestamp(),

            platform:
              "web"

          },

          {
            merge: true
          }

        );


        console.log(
          "OneSignal Subscription saved to Firestore:",
          subscriptionId
        );

      } catch (error) {

        console.error(
          "Subscription Save Error:",
          error
        );

      }

    }


    // =========================================
    // Check Existing Subscription
    // =========================================

    await saveSubscription();


    // =========================================
    // Listen for Subscription Changes
    // =========================================

    OneSignal.User.PushSubscription
      .addEventListener(
        "change",
        async function(event) {

          console.log(
            "OneSignal Subscription changed:",
            event
          );

          await saveSubscription();

        }
      );


    console.log(
      "OneSignal Permission:",
      OneSignal.Notifications.permission
    );


    console.log(
      "OneSignal Subscribed:",
      await OneSignal.User.PushSubscription.optedIn
    );


  } catch (error) {

    console.error(
      "OneSignal Initialization Error:",
      error
    );

  }

});

</script>
