<!DOCTYPE html>
<html lang="te">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Admin Panel</title>

<link
  rel="stylesheet"
  href="admin.css"
>

</head>


<body>


<script type="module">
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { auth } from "./firebase.js";

  const ADMIN_UIDS = [
    "dGNNq3QH2QfP5fe9P5lct5gHw073",
    "Y0q7rzVUL2Xdanjpce1QqxsLf5k2"
  ];

  onAuthStateChanged(auth, (user) => {
    if (!user || !ADMIN_UIDS.includes(user.uid)) {
      window.location.href = "login.html";
    }
  });
</script>


<button
  id="adminMenuButton"
  type="button"
  aria-label="Admin Menu"
  title="Admin Menu"
  onclick="toggleAdminMenu()"
>
  ⋮
</button>

<div id="adminMenuPanel">
  <button type="button" onclick="document.getElementById('title').scrollIntoView({behavior:'smooth'}); closeAdminMenu();">
    📰 News Management
  </button>

  <button type="button" onclick="document.getElementById('breakingNews').scrollIntoView({behavior:'smooth'}); closeAdminMenu();">
    🚨 Breaking & Push
  </button>

  <button type="button" onclick="document.getElementById('commentsSection').scrollIntoView({behavior:'smooth'}); closeAdminMenu();">
    💬 Comments
  </button>

  <button type="button" onclick="document.getElementById('newsList').scrollIntoView({behavior:'smooth'}); closeAdminMenu();">
    👁️ Published News & Views
  </button>

  <button type="button" class="coming-soon" disabled>
    📊 Analytics — Coming Soon
  </button>
</div>

<div class="container">
<!-- Floating Comments Button -->

<button
  id="commentsShortcut"
  style="width:250px;display:inline-block;padding:10px 18px;font-size:16px;border-radius:20px;box-sizing:border-box;"
  onclick="
    document
      .getElementById('commentsSection')
      .scrollIntoView({
        behavior: 'smooth'
      })
  "
>
  💬 Comments
</button>

<section id="dashboardSummary" class="dashboard-summary">
  <div class="dashboard-card">
    <div class="dashboard-icon">📰</div>
    <div class="dashboard-label">Total Published News</div>
    <div id="dashboardNewsCount" class="dashboard-value">0</div>
  </div>

  <div class="dashboard-card">
    <div class="dashboard-icon">👁️</div>
    <div class="dashboard-label">Total Views</div>
    <div id="dashboardViewsCount" class="dashboard-value">0</div>
  </div>

  <div class="dashboard-card">
    <div class="dashboard-icon">💬</div>
    <div class="dashboard-label">Total Comments</div>
    <div id="dashboardCommentsCount" class="dashboard-value">0</div>
  </div>
</section>

<h2>📰 News Upload</h2>


<input
  type="text"
  id="title"
  placeholder="News Title"
>

<button
  type="button"
  id="pasteNewsBtn"
>
  📋 Paste News
</button>


<!-- NEWS CONTENT -->

<div id="newsSections">

  <div class="news-section">

    <input
      type="text"
      class="subheading"
      placeholder="Subheading (Optional)"
    >

    <textarea
      class="paragraph"
      rows="5"
      placeholder="Paragraph"
    ></textarea>

  </div>

</div>


<button
  type="button"
  id="addSectionBtn"
>
  ➕ Add Subheading & Paragraph
</button>

<select id="category">

  <option value="">
    Select Category
  </option>

  <option value="Politics">Politics</option>
  <option value="Devotional">Devotional</option>
  <option value="Sports">Sports</option>
  <option value="Cinema">Cinema</option>
  <option value="Business">Business</option>
  <option value="Technology">Technology</option>
  <option value="National">National</option>
  <option value="International">International</option>
  <option value="Education">Education</option>
  <option value="Weather">Weather</option>
  <option value="Jobs">Jobs</option>
  <option value="Health">Health</option>
  <option value="Crime">Crime</option>
  <option value="Lifestyle">Lifestyle</option>
  <option value="Andhra Pradesh">Andhra Pradesh</option>
  <option value="Telangana">Telangana</option>
  <option value="Political Analysis">Political Analysis</option>
  <option value="RVP News Analysis">RVP News Analysis</option>

</select>


<input
  type="file"
  id="image"
>


<hr>


<h3>🚨 Breaking News</h3>


<input
  type="text"
  id="breakingNews"
  placeholder="Enter Breaking News"
>


<button id="saveBreaking">

  Save Breaking News

</button>


<hr>


<button id="publish">

  Publish

</button>


<hr>


<h2>📋 Published News</h2>


<div id="newsList"></div>


<hr>


<div id="commentsSection">

  <h2>💬 Comments Management</h2>

  <div id="commentsAdminList">

    <p>
      Loading Comments...
    </p>

  </div>

  <button type="button" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })" style="position:fixed;top:72px;right:12px;z-index:9998;padding:10px 18px;border:none;border-radius:20px;cursor:pointer;font-weight:600;font-size:16px;width:250px;box-sizing:border-box;background:#1565c0;color:white;">⬆️ పైకి</button>


</div>

  <p>
    Loading Comments...
  </p>

</div>


</div>


<script
  type="module"
  src="firebase.js"
></script>


<script
  type="module"
  src="script.js"
></script>


<script>
function toggleAdminMenu() {
  const panel = document.getElementById("adminMenuPanel");

  if (!panel) {
    return;
  }

  panel.style.display =
    panel.style.display === "block"
      ? "none"
      : "block";
}

function closeAdminMenu() {
  const panel = document.getElementById("adminMenuPanel");

  if (panel) {
    panel.style.display = "none";
  }
}
</script>

</body>

</html>
